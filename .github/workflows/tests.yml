name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install pytest-homeassistant-custom-component ruff
      - run: uv run --no-project ruff check .
      - run: uv run --no-project ruff format --check .
      - run: uv run --no-project python -m pytest
